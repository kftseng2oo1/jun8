<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#22305c"/>
      <stop offset="1" stop-color="#060a15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffbf6a" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ff9a4a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2240"/>
      <stop offset="1" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="soul" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".35" stop-color="#9fd2ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9fd2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t1" x1="0" x2="1"><stop offset="0" stop-color="#8f2a22"/><stop offset=".45" stop-color="#d9584a"/><stop offset="1" stop-color="#7e241d"/></linearGradient>
    <linearGradient id="t2" x1="0" x2="1"><stop offset="0" stop-color="#b07a22"/><stop offset=".45" stop-color="#f2c45a"/><stop offset="1" stop-color="#a06c1c"/></linearGradient>
    <linearGradient id="t3" x1="0" x2="1"><stop offset="0" stop-color="#245a48"/><stop offset=".45" stop-color="#4fa682"/><stop offset="1" stop-color="#1f4f3f"/></linearGradient>
    <linearGradient id="roof" x1="0" x2="1"><stop offset="0" stop-color="#5e1a14"/><stop offset=".45" stop-color="#b8362b"/><stop offset="1" stop-color="#521611"/></linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#cfd8ff" opacity=".55">
    <circle cx="92" cy="96" r="2"/><circle cx="420" cy="78" r="2.4"/><circle cx="372" cy="150" r="1.6"/>
    <circle cx="136" cy="176" r="1.5"/><circle cx="448" cy="226" r="1.6"/><circle cx="62" cy="250" r="1.4"/>
  </g>

  <!-- water -->
  <rect y="345" width="512" height="167" fill="url(#water)"/>
  <ellipse cx="256" cy="300" rx="215" ry="190" fill="url(#glow)"/>
  <rect x="200" y="347" width="112" height="120" fill="url(#refl)"/>
  <g fill="none" stroke="#5f87bd" stroke-linecap="round" opacity=".55">
    <path d="M70 380 q30 -8 60 0 t60 0" stroke-width="4"/>
    <path d="M322 384 q30 -8 60 0 t60 0" stroke-width="4"/>
    <path d="M120 420 q34 -9 68 0 t68 0 t68 0 t68 0" stroke-width="3.5" opacity=".7"/>
    <path d="M170 456 q28 -7 56 0 t56 0 t56 0" stroke-width="3" opacity=".5"/>
  </g>

  <!-- 䔲 -->
  <!-- base tier -->
  <path d="M174 345 L180 262 L332 262 L338 345 Z" fill="url(#t1)"/>
  <!-- middle tier -->
  <path d="M186 262 L191 200 L321 200 L326 262 Z" fill="url(#t2)"/>
  <!-- top tier -->
  <path d="M198 200 L202 146 L310 146 L314 200 Z" fill="url(#t3)"/>
  <!-- gold bands -->
  <g fill="#f6d98a">
    <rect x="172" y="337" width="168" height="8" rx="2"/>
    <rect x="178" y="256" width="156" height="9" rx="2"/>
    <rect x="189" y="195" width="134" height="8" rx="2"/>
    <rect x="200" y="142" width="112" height="7" rx="2"/>
  </g>
  <!-- arched windows -->
  <g fill="#3a1410" opacity=".55">
    <path d="M206 330 v-38 a12 12 0 0 1 24 0 v38 z"/><path d="M244 330 v-38 a12 12 0 0 1 24 0 v38 z"/><path d="M282 330 v-38 a12 12 0 0 1 24 0 v38 z"/>
  </g>
  <g fill="#ffeab0" opacity=".9">
    <circle cx="218" cy="300" r="5"/><circle cx="256" cy="300" r="5"/><circle cx="294" cy="300" r="5"/>
  </g>
  <g fill="#7a4a10" opacity=".6">
    <path d="M214 248 v-28 a10 10 0 0 1 20 0 v28 z"/><path d="M246 248 v-28 a10 10 0 0 1 20 0 v28 z"/><path d="M278 248 v-28 a10 10 0 0 1 20 0 v28 z"/>
  </g>
  <g fill="#c2483d"><circle cx="224" cy="230" r="4"/><circle cx="256" cy="230" r="4"/><circle cx="288" cy="230" r="4"/></g>
  <g fill="#123a2e" opacity=".6">
    <path d="M226 188 v-20 a8 8 0 0 1 16 0 v20 z"/><path d="M270 188 v-20 a8 8 0 0 1 16 0 v20 z"/>
  </g>
  <!-- roof & pole -->
  <path d="M188 146 Q256 132 324 146 L256 100 Z" fill="url(#roof)"/>
  <line x1="256" y1="104" x2="256" y2="64" stroke="#f6d98a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="62" r="7" fill="#ffd27a"/>

  <!-- rising souls -->
  <circle cx="136" cy="318" r="16" fill="url(#soul)"/>
  <circle cx="378" cy="290" r="19" fill="url(#soul)"/>
  <circle cx="150" cy="226" r="12" fill="url(#soul)" opacity=".8"/>
  <circle cx="362" cy="196" r="13" fill="url(#soul)" opacity=".8"/>
  <circle cx="392" cy="122" r="9" fill="url(#soul)" opacity=".6"/>
  <circle cx="122" cy="142" r="8" fill="url(#soul)" opacity=".55"/>
</svg>
