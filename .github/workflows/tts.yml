name: 旁白語音
on:
  push:
    paths: ["tts/**", ".github/workflows/tts.yml"]
  workflow_dispatch:
    inputs:
      force: { description: "全部重新念", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts==7.*
      - run: python tts/render.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Commit audio
        run: |
          git config user.name "tts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "產生旁白語音 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
